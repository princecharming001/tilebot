<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tilebot Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2f2;--card:#fff;--ink:#141414;--mute:#777;--line:#ebe5e5;--on:#1f9d55;--off:#cfc8c8;--warn:#c0392b;--btn:#141414;--btnink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--card:#1b1b1b;--ink:#f2f2f2;--mute:#999;--line:#2a2a2a;--off:#444;--btn:#f2f2f2;--btnink:#111}}
:root[data-theme="dark"]{--bg:#111;--card:#1b1b1b;--ink:#f2f2f2;--mute:#999;--line:#2a2a2a;--off:#444;--btn:#f2f2f2;--btnink:#111}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Helvetica,Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:48px 16px 60px}
h1{font:400 44px/1.05 "Instrument Serif",Georgia,serif;margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 18px;margin-bottom:16px}
input{width:100%;font:inherit;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
button{font:inherit;border:0;border-radius:999px;padding:13px 20px;background:var(--btn);color:var(--btnink);cursor:pointer}
button:disabled{opacity:.5}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.name{font-weight:600;font-size:17px}
.meta{font-size:14px;color:var(--mute);margin-top:2px}
.sw{position:relative;width:56px;height:32px;flex:none;border-radius:999px;background:var(--off);border:0;padding:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--on)}
.sw[aria-checked="true"]::after{transform:translateX(24px)}
.label{font-size:13px;color:var(--mute);margin:22px 4px 8px;text-transform:uppercase;letter-spacing:.06em}
.msg{font-size:14px;min-height:1.3em;margin:10px 4px;color:var(--mute)}
.msg.err{color:var(--warn)}
.add{display:flex;gap:8px;padding:14px 0}
.key{font:15px ui-monospace,Menlo,monospace;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;margin:0 0 14px;word-break:break-all}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>Tilebot admin</h1>

  <form id="login">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <div style="height:12px"></div>
    <button id="go" type="submit">Enter</button>
    <div id="loginMsg" class="msg"></div>
  </form>

  <section id="dash" class="hide">
    <div class="card">
      <div class="row">
        <div><div class="name" id="gTitle">Tilebot is on</div><div class="meta">Turn off to stop it for everyone.</div></div>
        <button id="global" class="sw" role="switch" aria-checked="true" aria-label="Tilebot on for everyone" type="button"></button>
      </div>
    </div>

    <div class="label">People</div>
    <div class="card" id="people"></div>

    <div class="label">Give someone access</div>
    <div class="card">
      <form class="add" id="addForm">
        <input id="who" placeholder="Their name" autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <div id="newKey" class="hide">
        <div class="meta" style="margin-bottom:8px">Send them this key:</div>
        <div id="keyText" class="key"></div>
      </div>
    </div>
    <div id="msg" class="msg"></div>
  </section>
</main>
<script>
(() => {
  "use strict";
  const API = "https://nxibeiykcgxpbmkeadth.supabase.co/functions/v1/tilebot";
  const $ = (id) => document.getElementById(id);
  let PW = "";
  try { PW = sessionStorage.getItem("tb-pw") || ""; } catch {}

  async function call(action, extra = {}) {
    const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: PW, action, ...extra }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || "Something went wrong"), { status: r.status });
    return j;
  }
  const ago = (iso) => {
    if (!iso) return "never used";
    const m = (Date.now() - Date.parse(iso)) / 60000;
    if (m < 2) return "using it now";
    if (m < 60) return `last used ${Math.round(m)} min ago`;
    if (m < 1440) return `last used ${Math.round(m / 60)} hr ago`;
    const d = Math.round(m / 1440); return `last used ${d} day${d > 1 ? "s" : ""} ago`;
  };
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

  function render(d) {
    $("global").setAttribute("aria-checked", String(d.enabled));
    $("gTitle").textContent = d.enabled ? "Tilebot is on" : "Tilebot is off for everyone";
    const box = $("people"); box.innerHTML = "";
    if (!d.people.length) box.innerHTML = '<div class="row"><div class="meta">No one yet.</div></div>';
    for (const p of d.people) {
      const row = document.createElement("div"); row.className = "row";
      const left = document.createElement("div");
      const n = document.createElement("div"); n.className = "name"; n.textContent = p.name;
      const m = document.createElement("div"); m.className = "meta";
      m.textContent = p.active ? `${plural(p.today, "game")} today · ${plural(p.week, "game")} this week · ${ago(p.last)}` : "Access off";
      left.append(n, m);
      const sw = document.createElement("button");
      sw.className = "sw"; sw.type = "button"; sw.setAttribute("role", "switch");
      sw.setAttribute("aria-checked", String(p.active)); sw.setAttribute("aria-label", "Access for " + p.name);
      sw.onclick = () => act("toggle", { hash: p.hash, active: !p.active }, `${p.name}: access ${p.active ? "off" : "on"}.`);
      row.append(left, sw); box.append(row);
    }
  }
  async function act(action, extra, done) {
    $("msg").textContent = "Saving…"; $("msg").classList.remove("err");
    try { const d = await call(action, extra); render(d); $("msg").textContent = done ? done + " Takes effect within a few minutes." : ""; return d; }
    catch (e) { $("msg").textContent = e.message; $("msg").classList.add("err"); if (e.status === 401) logout(); }
  }
  function logout() { PW = ""; try { sessionStorage.removeItem("tb-pw"); } catch {} $("dash").classList.add("hide"); $("login").classList.remove("hide"); }

  $("login").onsubmit = async (e) => {
    e.preventDefault();
    PW = $("pw").value; $("loginMsg").textContent = ""; $("loginMsg").classList.remove("err"); $("go").disabled = true;
    try { render(await call("list")); try { sessionStorage.setItem("tb-pw", PW); } catch {} $("pw").value = ""; $("login").classList.add("hide"); $("dash").classList.remove("hide"); }
    catch (err) { $("loginMsg").textContent = err.message; $("loginMsg").classList.add("err"); }
    finally { $("go").disabled = false; }
  };
  $("global").onclick = () => { const on = $("global").getAttribute("aria-checked") !== "true"; act("enabled", { on }, on ? "Tilebot is on." : "Tilebot is off for everyone."); };
  $("addForm").onsubmit = async (e) => {
    e.preventDefault();
    const name = $("who").value.trim(); if (!name) return;
    const d = await act("add", { name }, `Added ${name}.`);
    if (d && d.newKey) { $("keyText").textContent = d.newKey; $("newKey").classList.remove("hide"); $("who").value = ""; }
  };
  if (PW) call("list").then((d) => { render(d); $("login").classList.add("hide"); $("dash").classList.remove("hide"); }).catch(logout);
  setInterval(() => { if (PW && !document.hidden) call("list").then(render).catch(() => {}); }, 30000);
})();
</script>
</body>
</html>
