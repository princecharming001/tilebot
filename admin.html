<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f2f2">
<title>Tilebot Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0a'/%3E%3Crect x='7' y='7' width='8' height='8' rx='1.5' fill='%23fff'/%3E%3Crect x='17' y='7' width='8' height='8' rx='1.5' fill='%23fff' opacity='.4'/%3E%3Crect x='7' y='17' width='8' height='8' rx='1.5' fill='%23fff' opacity='.4'/%3E%3Crect x='17' y='17' width='8' height='8' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2f2; --ink:#0a0a0a; --mute:#8a8a90; --faint:#b4acac; --line:#e2dcdc; --line-2:#ece6e6;
  --card:#fff; --red:#e5372f; --red-soft:#fbe9e7; --green:#1f9d55; --chip:#f0eaea;
  --serif:"Instrument Serif","Times New Roman",serif; --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace; --shadow:0 1px 0 rgba(0,0,0,.02),0 16px 40px -30px rgba(60,40,40,.45);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
main{max-width:600px;margin:0 auto;padding:34px clamp(16px,5vw,26px) 72px}
button{font:inherit;letter-spacing:-0.01em;border:0;border-radius:7px;padding:11px 16px;background:var(--ink);color:#fff;cursor:pointer;transition:transform .12s,opacity .2s}
button:hover{opacity:.88}button:active{transform:translateY(1px)}button:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--ink);opacity:1}
button.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
button.danger:hover{border-color:var(--red);opacity:1}
button.sm{padding:7px 12px;font-size:13px;border-radius:6px}
input,select{width:100%;font:inherit;letter-spacing:-0.01em;padding:11px 13px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--ink)}
select{cursor:pointer;-webkit-appearance:none;appearance:none}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
.link:hover{color:var(--ink)}
.hide{display:none!important}

/* header + master bar */
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{display:inline-flex;align-items:center;gap:11px}
.brand svg{width:25px;height:25px;fill:var(--ink)}
.brand .wm{font-family:var(--serif);font-size:26px;line-height:1}
.brand .tag{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.14em;border-left:1px solid var(--line);padding-left:11px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:13px 16px;margin-bottom:14px}
.bar .master{display:flex;align-items:center;gap:11px;font-weight:600;font-size:15px}
.bar .sep{flex:1}
.bar .cap{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.bar .cap b{color:var(--ink);font-weight:600}
.sw{position:relative;width:46px;height:27px;flex:none;border-radius:999px;background:#d7d0d0;border:0;padding:0;cursor:pointer;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .28s cubic-bezier(.3,1.4,.5,1);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--ink)}.sw[aria-checked="true"]::after{transform:translateX(19px)}
.sw.sm{width:40px;height:24px}.sw.sm::after{width:18px;height:18px}.sw.sm[aria-checked="true"]::after{transform:translateX(16px)}
.stepbtn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:15px;line-height:1}
.offbar{background:var(--red-soft);color:var(--red);border:1px solid var(--red);border-radius:10px;padding:10px 15px;font-size:14px;margin-bottom:14px}

/* add */
.add{display:flex;gap:9px;margin:8px 0 6px}
.add input{flex:1}
.summary{font-size:13px;color:var(--mute);margin:16px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.summary .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:1px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* person card */
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:15px 17px;margin-bottom:12px}
.pc.dim{opacity:.62}
.pc-top{display:flex;align-items:center;gap:12px}
.pc-name{flex:1;font-family:var(--serif);font-size:23px;line-height:1.05;letter-spacing:-0.015em;display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}
.chip{display:inline-block;font:400 11px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:5px;background:var(--chip);color:var(--mute)}
.chip.on{background:#eef3f0;color:var(--green)}
.chip.now{background:var(--ink);color:#fff}
.chip.now::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#6cf09a;margin-right:6px;animation:pulse 1.2s ease-in-out infinite}
.chip.exp,.chip.cap{background:var(--red-soft);color:var(--red)}
.pc-code{display:flex;align-items:center;gap:9px;margin:11px 0 10px}
.pc-code .code{font:700 15px/1 var(--mono);letter-spacing:.04em;background:var(--bg);border:1px dashed var(--line);border-radius:7px;padding:8px 11px}
.pc-code .sep{flex:1}
.ic{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:13px;line-height:1;cursor:pointer}
.ic:hover{border-color:var(--ink);opacity:1}
.pc-stats{font-size:14px;color:var(--mute)}
.pc-stats b{color:var(--ink);font-weight:600}
.pc-spark{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:11px}
.pc-spark i{flex:1;background:#e7dede;border-radius:2px 2px 0 0;min-height:2px}
.pc-spark i.hi{background:var(--ink)}
.manage{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.manage .f{margin-bottom:10px}
.manage .f label{display:block;font-size:12px;color:var(--mute);margin:0 0 5px 1px;text-transform:uppercase;letter-spacing:.05em}
.manage .two{display:flex;gap:9px}.manage .two>div{flex:1}
.manage .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}

/* login */
.login{max-width:340px;margin:9vh auto 0}
.login h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,9vw,60px);line-height:.95;letter-spacing:-0.035em;margin:0 0 6px}
.login p{color:var(--mute);margin:0 0 24px}
.msg{font-size:14px;min-height:1.2em;margin:11px 2px;color:var(--mute)}.msg.err{color:var(--red)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;font-size:13px;color:var(--faint);flex-wrap:wrap;gap:8px}
.empty{color:var(--mute);padding:20px 2px;text-align:center}
.codepanel{border:1px solid var(--ink);border-radius:10px;padding:16px 18px;margin-bottom:14px;background:#fcfbf9}
.codepanel .who{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.codepanel .big{font:700 28px/1 var(--mono);letter-spacing:.05em;margin:12px 0 15px;text-align:center}
.codepanel .frow{display:flex;gap:9px}.codepanel .frow button{flex:1}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:7px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main>
  <div class="head">
    <span class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="1.6"/><rect x="13" y="2" width="9" height="9" rx="1.6" opacity=".35"/><rect x="2" y="13" width="9" height="9" rx="1.6" opacity=".35"/><rect x="13" y="13" width="9" height="9" rx="1.6"/></svg>
      <span class="wm">Tilebot</span><span class="tag">Admin</span>
    </span>
    <button id="logout" class="link hide" type="button">Log out</button>
  </div>

  <form id="login" class="login">
    <h1>Admin</h1>
    <p>Enter your password to manage access.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <div style="height:12px"></div>
    <button id="go" type="submit" style="width:100%">Enter</button>
    <div id="loginMsg" class="msg"></div>
  </form>

  <section id="dash" class="hide">
    <div id="offBar" class="offbar hide">Tilebot is switched off for everyone.</div>

    <div class="bar">
      <div class="master"><span id="gTitle">Tilebot is on</span>
        <button id="global" class="sw" role="switch" aria-checked="true" aria-label="Tilebot on for everyone" type="button"></button>
      </div>
      <div class="sep"></div>
      <div class="cap">Default cap
        <button class="stepbtn" id="defMinus" type="button" aria-label="Lower">–</button>
        <b id="defVal">10</b><span>/day</span>
        <button class="stepbtn" id="defPlus" type="button" aria-label="Raise">+</button>
      </div>
    </div>

    <div id="codePanel" class="codepanel hide"></div>
    <form class="add" id="addForm">
      <input id="who" placeholder="Add a player by name" autocomplete="off" maxlength="40">
      <button type="submit" id="addBtn">Add</button>
    </form>

    <div class="summary"><span id="sumLeft">Players</span><span id="sumRight"></span></div>
    <div id="people"></div>

    <div id="msg" class="msg"></div>
    <div class="foot">
      <button class="link" id="exportBtn" type="button">Export usage (CSV)</button>
      <span>Changes reach the app within a few minutes.</span>
    </div>
  </section>
</main>
<div id="toast" class="toast"></div>

<script>
(() => {
  "use strict";
  const API = "https://nxibeiykcgxpbmkeadth.supabase.co/functions/v1/tilebot";
  const $ = (id) => document.getElementById(id);
  let PW = ""; try { PW = sessionStorage.getItem("tb-pw") || ""; } catch {}
  const S = { data: null, open: new Set(), editing: false, busy: false, code: null };

  let apiCall = async (action, extra = {}) => {
    const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: PW, action, ...extra }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || "Something went wrong"), { status: r.status });
    return j;
  };

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const nfmt = (n) => (n == null ? "—" : Number(n).toLocaleString());
  const ago = (iso) => {
    if (!iso) return "never used it";
    const m = (Date.now() - Date.parse(iso)) / 60000;
    if (m < 2) return "using it now"; if (m < 60) return `${Math.round(m)} min ago`;
    if (m < 1440) return `${Math.round(m / 60)} hr ago`;
    const d = Math.round(m / 1440); return `${plural(d, "day")} ago`;
  };
  const fdate = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
  const toYMD = (iso) => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? "" : d.toISOString().slice(0, 10); };
  const live = (p) => p.last && Date.now() - Date.parse(p.last) < 15 * 60e3;
  let toastT; function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1600); }
  async function copy(text, label) {
    let ok = false; try { await navigator.clipboard.writeText(text); ok = true; } catch {}
    if (!ok) { try { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.focus(); ta.select(); ok = document.execCommand("copy"); ta.remove(); } catch {} }
    toast(ok ? (label || "Copied") : "Press ⌘/Ctrl+C"); return ok;
  }
  const byHash = (h) => (S.data.people || []).find((p) => p.hash === h);
  function sparkHTML(arr) { const max = Math.max(1, ...arr); return arr.map((v, i) => `<i class="${i === arr.length - 1 ? "hi" : ""}" style="height:${Math.round(v / max * 100)}%" title="${v}"></i>`).join(""); }
  function statusChip(p) {
    if (!p.active) return '<span class="chip">Access off</span>';
    if (p.expires && !p.live) return '<span class="chip exp">Expired</span>';
    if (p.cappedToday) return '<span class="chip cap">At daily limit</span>';
    if (live(p)) return '<span class="chip now">Playing now</span>';
    return '<span class="chip on">Active</span>';
  }

  /* ---- person cards ---- */
  function renderPeople() {
    const box = $("people"), ppl = S.data.people || [];
    if (!ppl.length) { box.innerHTML = '<div class="empty">No players yet. Add one above.</div>'; return; }
    box.innerHTML = ppl.map(cardHTML).join("");
    for (const p of ppl) wireCard(p);
  }
  function cardHTML(p) {
    const open = S.open.has(p.hash);
    const codeLine = p.code
      ? `<span class="code">${esc(p.code)}</span><button class="ic" data-act="copy">Copy</button>`
      : `<button class="ic" data-act="makecode">Make code</button>`;
    const cap = p.effLimit > 0 ? ` · ${p.today}/${p.effLimit} today` : "";
    const stats = p.active
      ? `<b>${p.today}</b> today · <b>${p.week}</b> this week · <b>${p.month}</b> this month · best <b>${nfmt(p.best)}</b> · ${ago(p.last)}`
      : "Access turned off";
    return `
    <div class="pc ${p.active ? "" : "dim"}" data-hash="${p.hash}">
      <div class="pc-top">
        <div class="pc-name">${esc(p.name)} ${statusChip(p)}</div>
        <button class="sw sm" role="switch" aria-checked="${p.active}" data-act="access" title="Access on/off"></button>
      </div>
      <div class="pc-code">${codeLine}<span class="sep"></span><button class="ic" data-act="manage">${open ? "Close" : "Manage"}</button></div>
      <div class="pc-stats">${stats}${cap}</div>
      <div class="pc-spark">${sparkHTML(p.daily || [])}</div>
      ${open ? manageHTML(p) : ""}
    </div>`;
  }
  function manageHTML(p) {
    const def = S.data.defaultDaily ?? 10;
    const mode = p.dailyLimit == null ? "default" : p.dailyLimit === 0 ? "none" : "custom";
    return `
    <div class="manage">
      <div class="f"><label>Name</label><input data-f="name" value="${esc(p.name)}" maxlength="40"></div>
      <div class="two">
        <div class="f"><label>Daily cap</label>
          <select data-f="mode">
            <option value="default"${mode === "default" ? " selected" : ""}>Default (${def}/day)</option>
            <option value="none"${mode === "none" ? " selected" : ""}>No limit</option>
            <option value="custom"${mode === "custom" ? " selected" : ""}>Custom…</option>
          </select>
          <input type="number" min="1" data-f="num" class="${mode === "custom" ? "" : "hide"}" style="margin-top:8px" placeholder="games/day" value="${mode === "custom" ? p.dailyLimit : ""}">
        </div>
        <div class="f"><label>Access expires</label><input type="date" data-f="expires" value="${toYMD(p.expires)}"></div>
      </div>
      <div class="acts">
        <button class="sm" data-act="save">Save</button>
        ${p.code ? '<button class="ghost sm" data-act="newcode">New code</button>' : ""}
        <button class="danger sm" data-act="remove">Remove</button>
      </div>
    </div>`;
  }
  function wireCard(p) {
    const el = document.querySelector(`.pc[data-hash="${p.hash}"]`); if (!el) return;
    const on = (sel, fn) => el.querySelectorAll(sel).forEach((n) => n.addEventListener("click", fn));
    on('[data-act="access"]', () => act("toggle", { hash: p.hash, active: !p.active }, `${p.name}: access ${p.active ? "off" : "on"}`));
    on('[data-act="copy"]', () => copy(p.code, `Copied ${p.name}'s code`));
    on('[data-act="makecode"]', () => { if (confirm(`Generate an access code for ${p.name}?`)) genCode(p); });
    on('[data-act="manage"]', () => { S.open.has(p.hash) ? S.open.delete(p.hash) : S.open.add(p.hash); S.editing = false; renderPeople(); });
    const man = el.querySelector(".manage"); if (!man) return;
    const modeSel = man.querySelector('[data-f="mode"]'), numEl = man.querySelector('[data-f="num"]');
    modeSel.onchange = () => { numEl.classList.toggle("hide", modeSel.value !== "custom"); if (modeSel.value === "custom") numEl.focus(); };
    man.querySelector('[data-act="save"]').onclick = () => {
      const g = (f) => man.querySelector(`[data-f="${f}"]`).value;
      const name = g("name").trim(); if (!name) { toast("Name can't be empty"); return; }
      let daily_limit = null;
      if (modeSel.value === "none") daily_limit = 0;
      else if (modeSel.value === "custom") { const n = parseInt(numEl.value, 10); if (!(n >= 1)) { toast("Enter games/day or pick No limit"); return; } daily_limit = n; }
      S.editing = false; S.open.delete(p.hash);
      act("update", { hash: p.hash, name, expires: g("expires") || "", daily_limit }, "Saved");
    };
    const nc = man.querySelector('[data-act="newcode"]'); if (nc) nc.onclick = () => { if (confirm(`Replace ${p.name}'s code? The old one stops working.`)) genCode(p); };
    man.querySelector('[data-act="remove"]').onclick = () => { if (confirm(`Remove ${p.name}? Deletes their access and usage. Can't be undone.`)) act("remove", { hash: p.hash }, `${p.name} removed`).then(() => S.open.delete(p.hash)); };
    el.querySelectorAll("[data-f]").forEach((n) => { n.addEventListener("focus", () => S.editing = true); n.addEventListener("blur", () => S.editing = false); });
  }

  async function genCode(p) {
    const d = await act("newcode", { hash: p.hash }, null, true);
    if (d && d.newKey) { showCode(d.newKey, p.name, d.newFor); copy(d.newKey, `New code for ${p.name} copied`); }
  }
  function showCode(code, name) {
    S.code = { code, name };
    const el = $("codePanel"); el.classList.remove("hide");
    el.innerHTML = `<div class="who"><span>Code for ${esc(name)}</span><button class="link" data-x style="color:var(--mute)">Done</button></div>
      <div class="big">${esc(code)}</div>
      <div class="frow"><button data-copy>Copy code</button><button class="ghost" data-invite>Copy invite</button></div>`;
    el.querySelector("[data-copy]").onclick = () => copy(code, `${name}'s code copied`);
    el.querySelector("[data-invite]").onclick = () => copy(`Here's your Tilebot access code: ${code}\nDownload Tilebot, then paste this code when it asks.`, "Invite copied");
    el.querySelector("[data-x]").onclick = () => { S.code = null; el.classList.add("hide"); };
  }

  function render(d) {
    S.data = d;
    $("global").setAttribute("aria-checked", String(d.enabled));
    $("gTitle").textContent = d.enabled ? "Tilebot is on" : "Tilebot is off for everyone";
    $("offBar").classList.toggle("hide", d.enabled);
    const def = d.defaultDaily ?? 10; $("defVal").textContent = def === 0 ? "none" : def;
    const s = d.summary || {};
    $("sumLeft").textContent = `${plural(s.people ?? 0, "player")}`;
    $("sumRight").innerHTML = `${s.playingNow ? '<span class="dot"></span>' + s.playingNow + " playing now · " : ""}${s.gamesToday ?? 0} games today · ${plural(s.gamesWeek ?? 0, "game")} this week`;
    if (S.code) { const p = (d.people || []).find((x) => x.name === S.code.name); if (p && p.code) S.code.code = p.code; }
    renderPeople();
  }

  async function act(action, extra, okMsg, quiet) {
    if (S.busy) return;
    S.busy = true; $("msg").classList.remove("err"); if (!quiet) $("msg").textContent = "Saving…";
    try { const d = await apiCall(action, extra); render(d); $("msg").textContent = okMsg || ""; if (okMsg) toast(okMsg); return d; }
    catch (e) { $("msg").textContent = e.message; $("msg").classList.add("err"); if (e.status === 401) logout(); }
    finally { S.busy = false; }
  }

  function showDash() { $("login").classList.add("hide"); $("dash").classList.remove("hide"); $("logout").classList.remove("hide"); }
  function logout() { PW = ""; try { sessionStorage.removeItem("tb-pw"); } catch {} $("dash").classList.add("hide"); $("login").classList.remove("hide"); $("logout").classList.add("hide"); $("pw").focus(); }
  $("login").onsubmit = async (e) => {
    e.preventDefault(); PW = $("pw").value; $("loginMsg").textContent = ""; $("loginMsg").classList.remove("err"); $("go").disabled = true;
    try { render(await apiCall("list")); try { sessionStorage.setItem("tb-pw", PW); } catch {} $("pw").value = ""; showDash(); }
    catch (err) { $("loginMsg").textContent = err.message; $("loginMsg").classList.add("err"); } finally { $("go").disabled = false; }
  };
  $("logout").onclick = logout;
  $("global").onclick = () => { const on = $("global").getAttribute("aria-checked") !== "true"; act("enabled", { on }, on ? "Tilebot is on" : "Tilebot is off for everyone"); };
  const setDefault = (n) => { n = Math.max(0, Math.min(999, Math.trunc(n))); act("default", { limit: n }, n === 0 ? "No daily limit for anyone" : `Default cap ${n}/day`); };
  $("defMinus").onclick = () => setDefault((parseInt($("defVal").textContent, 10) || 0) - 1);
  $("defPlus").onclick = () => setDefault((parseInt($("defVal").textContent, 10) || 0) + 1);
  $("addForm").onsubmit = async (e) => {
    e.preventDefault(); const name = $("who").value.trim(); if (!name) return;
    $("addBtn").disabled = true; const d = await act("add", { name }, `Added ${name}`, true); $("addBtn").disabled = false;
    if (d && d.newKey) { $("who").value = ""; showCode(d.newKey, name); copy(d.newKey, `${name}'s code copied`); }
  };
  $("exportBtn").onclick = () => exportCSV();
  function exportCSV() {
    if (!S.data || !S.data.people.length) { toast("Nothing to export"); return; }
    const head = ["Name", "Access", "Expires", "Today", "Week", "Month", "Days", "Avg", "Best", "Last used", "App", "Added", "Code"];
    const rows = S.data.people.map((p) => [p.name, p.active ? (p.live ? "on" : "expired") : "off", p.expires ? toYMD(p.expires) : "",
      p.today, p.week, p.month, p.days, p.avg ?? "", p.best ?? "", p.last ? new Date(p.last).toISOString() : "", p.version ?? "", toYMD(p.added), p.code ?? ""]);
    const csv = [head, ...rows].map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = `tilebot-usage-${toYMD(new Date().toISOString())}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast("CSV downloaded");
  }

  if (PW) apiCall("list").then((d) => { render(d); showDash(); }).catch(logout);
  setInterval(() => { if (PW && !document.hidden && !S.editing && !S.busy && !$("dash").classList.contains("hide")) apiCall("list").then(render).catch(() => {}); }, 30000);
  window.__TB = { setMock(fn) { apiCall = fn; }, render, showDash, state: S, boot: (d) => { render(d); showDash(); } };
})();
</script>
</body>
</html>
