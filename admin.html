<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tilebot Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2f2;--card:#fff;--ink:#141414;--mute:#777;--faint:#a79f9f;--line:#ebe5e5;
  --on:#1f9d55;--on-soft:#e6f4ec;--off:#cfc8c8;--warn:#c0392b;--warn-soft:#fbeceb;
  --btn:#141414;--btnink:#fff;--chip:#f0eaea;--accent:#2b6cb0;--bar:#d8cfcf;--bar-hi:#141414;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111;--card:#1b1b1b;--ink:#f2f2f2;--mute:#999;--faint:#6b6b6b;--line:#2a2a2a;
  --on:#2ec16b;--on-soft:#16311f;--off:#444;--warn:#e06a5c;--warn-soft:#331a17;
  --btn:#f2f2f2;--btnink:#111;--chip:#262626;--accent:#6ba6e0;--bar:#333;--bar-hi:#f2f2f2;
}}
:root[data-theme="dark"]{
  --bg:#111;--card:#1b1b1b;--ink:#f2f2f2;--mute:#999;--faint:#6b6b6b;--line:#2a2a2a;
  --on:#2ec16b;--on-soft:#16311f;--off:#444;--warn:#e06a5c;--warn-soft:#331a17;
  --btn:#f2f2f2;--btnink:#111;--chip:#262626;--accent:#6ba6e0;--bar:#333;--bar-hi:#f2f2f2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:40px 16px 72px}
h1{font:400 44px/1.05 "Instrument Serif",Georgia,serif;margin:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;cursor:pointer;padding:4px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 18px;margin-bottom:16px}
.card.pad{padding:18px}
input,select,textarea{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical;min-height:52px}
select{cursor:pointer;-webkit-appearance:none;appearance:none}
button{font:inherit;border:0;border-radius:999px;padding:13px 20px;background:var(--btn);color:var(--btnink);cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--mute)}
button.danger{background:transparent;color:var(--warn);border:1px solid var(--line)}
button.danger:hover{border-color:var(--warn)}
button.sm{padding:8px 14px;font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.name{font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta{font-size:14px;color:var(--mute);margin-top:3px}
.sw{position:relative;width:52px;height:30px;flex:none;border-radius:999px;background:var(--off);border:0;padding:0;transition:background .2s;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--on)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.label{font-size:13px;color:var(--mute);margin:26px 4px 8px;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:baseline}
.msg{font-size:14px;min-height:1.2em;margin:8px 4px;color:var(--mute)}
.msg.err{color:var(--warn)}
.hide{display:none!important}
.key{font:17px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.04em;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:14px;word-break:break-all}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.stat{background:var(--card);padding:14px 12px}
.stat b{display:block;font-size:24px;font-weight:600;line-height:1.1}
.stat span{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.stat.live b{color:var(--on)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}

/* spark */
.spark{display:flex;align-items:flex-end;gap:3px;height:38px}
.spark i{flex:1;background:var(--bar);border-radius:3px 3px 0 0;min-height:2px;transition:height .2s}
.spark i.hi{background:var(--bar-hi)}
.sparkwrap{padding:4px 2px 2px}
.mini{display:flex;align-items:flex-end;gap:2px;height:26px;margin:4px 0}
.mini i{flex:1;background:var(--bar);border-radius:2px 2px 0 0;min-height:2px}

/* people */
.prow{border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.phead{display:flex;align-items:center;gap:12px;padding:14px 0;cursor:pointer}
.phead .grow{flex:1;min-width:0}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--mute)}
.chip.on{background:var(--on-soft);color:var(--on)}
.chip.off{background:var(--chip);color:var(--faint)}
.chip.exp{background:var(--warn-soft);color:var(--warn)}
.chip.now{background:var(--on);color:#fff}
.icbtn{flex:none;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;gap:6px}
.icbtn:hover{border-color:var(--mute)}
.icbtn.pri{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.caret{color:var(--faint);transition:transform .15s;flex:none}
.prow.open .caret{transform:rotate(90deg)}
.detail{padding:4px 0 20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px}
.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box b{display:block;font-size:19px;font-weight:600}
.box span{font-size:12px;color:var(--mute)}
.recent{font-size:13px;color:var(--mute);margin-top:8px}
.recent div{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.edit{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.edit .f{margin-bottom:10px}
.edit .f label{display:block;font-size:12px;color:var(--mute);margin:0 0 5px 2px;text-transform:uppercase;letter-spacing:.04em}
.frow{display:flex;gap:8px}
.search{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.search select{width:auto;flex:none;padding:13px 30px 13px 12px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 15px) 18px,calc(100% - 10px) 18px;background-size:5px 5px;background-repeat:no-repeat}
.add{display:flex;gap:8px;padding:14px 0}
.codepanel{border:1px solid var(--on);background:var(--on-soft);border-radius:14px;padding:16px;margin:4px 0 14px}
.codepanel .who{font-size:13px;color:var(--on);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:flex;justify-content:space-between}
.codepanel .big{font:28px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;color:var(--ink);margin:4px 0 14px;text-align:center}
.codepanel .frow button{flex:1}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--mute);padding:18px 0;text-align:center;font-size:15px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:26px;font-size:13px;color:var(--faint)}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Tilebot admin</h1><button id="logout" class="link hide" type="button">Log out</button></div>

  <form id="login">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <div style="height:12px"></div>
    <button id="go" type="submit">Enter</button>
    <div id="loginMsg" class="msg"></div>
  </form>

  <section id="dash" class="hide">
    <div id="offBanner" class="banner hide">⚠ Tilebot is OFF for everyone right now.</div>

    <div class="card">
      <div class="row">
        <div><div class="name" id="gTitle">Tilebot is on</div><div class="meta">Master switch — turn off to stop it for everyone instantly.</div></div>
        <button id="global" class="sw" role="switch" aria-checked="true" aria-label="Tilebot on for everyone" type="button"></button>
      </div>
    </div>

    <div class="label">At a glance</div>
    <div class="stats" id="stats"></div>
    <div class="card pad sparkwrap">
      <div class="meta" style="margin:0 0 8px;display:flex;justify-content:space-between"><span>Games · last 14 days</span><span id="sparkTotal"></span></div>
      <div class="spark" id="spark"></div>
    </div>

    <div class="label">Add someone</div>
    <div class="card pad">
      <div id="codePanel" class="codepanel hide"></div>
      <form class="add" id="addForm" style="padding:0">
        <input id="who" placeholder="Their name" autocomplete="off" maxlength="40">
        <button type="submit" id="addBtn">Add</button>
      </form>
      <div class="meta" style="margin:8px 2px 2px">Creates an access code instantly — copy it and send it to them.</div>
    </div>

    <div class="label"><span>People</span><span id="pcount" style="text-transform:none;letter-spacing:0"></span></div>
    <div class="card pad">
      <div class="search">
        <input id="q" placeholder="Search name or note" autocomplete="off">
        <select id="sort" aria-label="Sort people">
          <option value="recent">Recent activity</option>
          <option value="games">Most games</option>
          <option value="name">Name A–Z</option>
          <option value="new">Newest added</option>
          <option value="off">Access off first</option>
        </select>
      </div>
      <div id="people"></div>
    </div>

    <div id="msg" class="msg"></div>
    <div class="foot">
      <button class="link" id="exportBtn" type="button">Export usage (CSV)</button>
      <span>Changes reach the app within a few minutes.</span>
    </div>
  </section>
</main>
<div id="toast" class="toast"></div>

<script>
(() => {
  "use strict";
  const API = "https://nxibeiykcgxpbmkeadth.supabase.co/functions/v1/tilebot";
  const $ = (id) => document.getElementById(id);
  let PW = "";
  try { PW = sessionStorage.getItem("tb-pw") || ""; } catch {}

  const S = { data: null, q: "", sort: "recent", open: null, editing: false, busy: false, code: null };

  // --- API seam (overridable for local testing via window.__TB.setMock) ---
  let apiCall = async (action, extra = {}) => {
    const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: PW, action, ...extra }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || "Something went wrong"), { status: r.status });
    return j;
  };

  // --- helpers ---
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const ago = (iso) => {
    if (!iso) return "never used it";
    const m = (Date.now() - Date.parse(iso)) / 60000;
    if (m < 2) return "using it now";
    if (m < 60) return `${Math.round(m)} min ago`;
    if (m < 1440) return `${Math.round(m / 60)} hr ago`;
    const d = Math.round(m / 1440); return `${plural(d, "day")} ago`;
  };
  const fdate = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
  const toYMD = (iso) => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? "" : d.toISOString().slice(0, 10); };
  let toastT;
  function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1600); }

  async function copy(text, label) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch {}
    if (!ok) { try { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.focus(); ta.select(); ok = document.execCommand("copy"); ta.remove(); } catch {} }
    toast(ok ? (label || "Copied") : "Press ⌘/Ctrl+C to copy");
    return ok;
  }

  // --- sparkline ---
  function spark(el, arr, cls) {
    const max = Math.max(1, ...arr);
    el.innerHTML = arr.map((v, i) => `<i class="${i === arr.length - 1 ? "hi" : ""}" style="height:${Math.round((v / max) * 100)}%" title="${v}"></i>`).join("");
  }

  // --- filter + sort ---
  function peopleView() {
    const q = S.q.trim().toLowerCase();
    let arr = (S.data.people || []).filter((p) => !q || p.name.toLowerCase().includes(q) || (p.note || "").toLowerCase().includes(q));
    const by = {
      recent: (a, b) => (Date.parse(b.last) || 0) - (Date.parse(a.last) || 0),
      games: (a, b) => b.week - a.week || b.month - a.month,
      name: (a, b) => a.name.localeCompare(b.name),
      new: (a, b) => (Date.parse(b.added) || 0) - (Date.parse(a.added) || 0),
      off: (a, b) => (a.live - b.live) || a.name.localeCompare(b.name),
    };
    return arr.sort(by[S.sort] || by.recent);
  }

  function stateChip(p) {
    if (!p.active) return '<span class="chip off">Access off</span>';
    if (p.expires && !p.live) return '<span class="chip exp">Expired</span>';
    if (p.last && Date.now() - Date.parse(p.last) < 15 * 60e3) return '<span class="chip now">Playing now</span>';
    return '<span class="chip on">Active</span>';
  }

  // --- render people ---
  function renderPeople() {
    const box = $("people");
    const list = peopleView();
    $("pcount").textContent = S.data.people.length ? `${list.length} shown` : "";
    if (!S.data.people.length) { box.innerHTML = '<div class="empty">No one yet. Add your first person above.</div>'; return; }
    if (!list.length) { box.innerHTML = '<div class="empty">No matches.</div>'; return; }
    box.innerHTML = list.map(personHTML).join("");
    // wire each row
    for (const p of list) wireRow(p);
  }

  function personHTML(p) {
    const open = S.open === p.hash;
    const copyBtn = p.code
      ? `<button class="icbtn pri" data-act="copy" title="Copy ${esc(p.name)}'s code">Copy code</button>`
      : `<button class="icbtn" data-act="makecode" title="No code saved — generate one">Make code</button>`;
    const sub = p.active
      ? `${plural(p.today, "game")} today · ${plural(p.week, "game")} this week · ${ago(p.last)}`
      : "Access turned off";
    return `
    <div class="prow ${open ? "open" : ""}" data-hash="${p.hash}">
      <div class="phead">
        <div class="grow" data-act="toggleOpen">
          <div class="name">${esc(p.name)} ${stateChip(p)}</div>
          <div class="meta">${sub}</div>
        </div>
        ${copyBtn}
        <button class="sw" role="switch" aria-checked="${p.active}" aria-label="Access for ${esc(p.name)}" data-act="access"></button>
        <span class="caret" data-act="toggleOpen">▸</span>
      </div>
      ${open ? detailHTML(p) : ""}
    </div>`;
  }

  function detailHTML(p) {
    const cells = [
      ["Today", p.today], ["This week", p.week], ["This month", p.month],
      ["Days active", p.days], ["Avg score", p.avg == null ? "—" : p.avg], ["Best score", p.best == null ? "—" : p.best],
    ].map(([k, v]) => `<div class="box"><b>${v}</b><span>${k}</span></div>`).join("");
    const recent = (p.recent || []).length
      ? `<div class="recent"><div style="border:0;color:var(--faint)"><span>Recent games</span><span></span></div>` +
        p.recent.slice(0, 8).map((r) => `<div><span>${esc(r.score ? r.score + " pts" : "played")}${r.words ? " · " + r.words + " words" : ""}</span><span>${ago(r.ts)}</span></div>`).join("") + `</div>`
      : `<div class="recent" style="color:var(--faint)">No games recorded yet.</div>`;
    const info = [
      p.version ? `App ${esc(p.version)}` : null,
      `Added ${fdate(p.added)}`,
      p.expires ? `Expires ${fdate(p.expires)}` : "No expiry",
      p.code ? `Code ${esc(p.code)}` : "No code saved",
    ].filter(Boolean).join(" · ");
    const codeAct = p.code
      ? `<button class="ghost sm" data-act="copy">Copy code</button><button class="ghost sm" data-act="newcode">New code</button>`
      : `<button class="ghost sm" data-act="makecode">Generate code</button>`;
    return `
    <div class="detail">
      <div class="mini" data-mini></div>
      <div class="grid">${cells}</div>
      <div class="meta" style="margin:0 0 4px">${info}</div>
      ${recent}
      <div class="acts">
        ${codeAct}
        <button class="ghost sm" data-act="edit">Edit</button>
        <button class="danger sm" data-act="remove">Remove</button>
      </div>
      <div class="edit hide" data-edit></div>
    </div>`;
  }

  function editFormHTML(p) {
    return `
      <div class="f"><label>Name</label><input data-f="name" value="${esc(p.name)}" maxlength="40"></div>
      <div class="f"><label>Note (only you see this)</label><textarea data-f="note" maxlength="500" placeholder="e.g. cousin, trial, paid">${esc(p.note)}</textarea></div>
      <div class="f"><label>Access expires (optional)</label><input type="date" data-f="expires" value="${toYMD(p.expires)}"></div>
      <div class="frow"><button class="sm" data-act="save">Save</button><button class="ghost sm" data-act="cancelEdit">Cancel</button>${p.expires ? '<button class="ghost sm" data-act="clearExp">Clear expiry</button>' : ""}</div>`;
  }

  function wireRow(p) {
    const el = document.querySelector(`.prow[data-hash="${p.hash}"]`);
    if (!el) return;
    const on = (sel, ev, fn) => el.querySelectorAll(sel).forEach((n) => n.addEventListener(ev, fn));
    el.querySelectorAll('[data-act="toggleOpen"]').forEach((n) => n.addEventListener("click", () => { S.open = S.open === p.hash ? null : p.hash; S.editing = false; renderPeople(); }));
    const access = el.querySelector('[data-act="access"]');
    if (access) access.addEventListener("click", (e) => { e.stopPropagation(); act("toggle", { hash: p.hash, active: !p.active }, `${p.name}: access ${p.active ? "off" : "on"}`); });
    on('[data-act="copy"]', "click", (e) => { e.stopPropagation(); copy(p.code, `Copied ${p.name}'s code`); });
    on('[data-act="makecode"]', "click", (e) => { e.stopPropagation(); if (confirm(`Generate an access code for ${p.name}? They don't have one saved yet.`)) genCode(p); });
    on('[data-act="newcode"]', "click", () => { if (confirm(`Replace ${p.name}'s code? Their current code stops working right away.`)) genCode(p); });
    const mini = el.querySelector("[data-mini]"); if (mini) spark(mini, p.daily || []);
    on('[data-act="edit"]', "click", () => openEdit(p));
    on('[data-act="remove"]', "click", () => { if (confirm(`Remove ${p.name}? This deletes their access and usage history. This can't be undone.`)) act("remove", { hash: p.hash }, `${p.name} removed`).then(() => { S.open = null; }); });
  }

  function openEdit(p) {
    S.editing = true;
    const el = document.querySelector(`.prow[data-hash="${p.hash}"] [data-edit]`);
    if (!el) return;
    el.className = "edit"; el.innerHTML = editFormHTML(p);
    el.querySelector('[data-act="cancelEdit"]').onclick = () => { S.editing = false; renderPeople(); };
    el.querySelector('[data-act="save"]').onclick = () => {
      const g = (f) => el.querySelector(`[data-f="${f}"]`).value;
      const name = g("name").trim(); if (!name) { toast("Name can't be empty"); return; }
      S.editing = false;
      act("update", { hash: p.hash, name, note: g("note"), expires: g("expires") || "" }, "Saved");
    };
    const clr = el.querySelector('[data-act="clearExp"]');
    if (clr) clr.onclick = () => { S.editing = false; act("update", { hash: p.hash, expires: "" }, "Expiry cleared"); };
    const ni = el.querySelector('[data-f="name"]'); if (ni) ni.focus();
  }

  async function genCode(p) {
    const d = await act("newcode", { hash: p.hash }, null, true);
    if (d && d.newKey) { showCode(d.newKey, p.name, d.newFor); copy(d.newKey, `New code for ${p.name} copied`); }
  }

  function showCode(code, name, hash) {
    S.code = { code, name, hash };
    const el = $("codePanel"); el.classList.remove("hide");
    el.innerHTML = `
      <div class="who"><span>Code for ${esc(name)}</span><button class="link" data-x style="color:var(--on)">Done</button></div>
      <div class="big">${esc(code)}</div>
      <div class="frow">
        <button data-copy>Copy code</button>
        <button class="ghost" data-invite>Copy invite message</button>
      </div>`;
    el.querySelector("[data-copy]").onclick = () => copy(code, `${name}'s code copied`);
    el.querySelector("[data-invite]").onclick = () => copy(`Here's your Tilebot access code: ${code}\nDownload Tilebot, then paste this code when it asks.`, "Invite message copied");
    el.querySelector("[data-x]").onclick = () => { S.code = null; el.classList.add("hide"); };
  }

  // --- global render ---
  function render(d) {
    S.data = d;
    $("global").setAttribute("aria-checked", String(d.enabled));
    $("gTitle").textContent = d.enabled ? "Tilebot is on" : "Tilebot is off for everyone";
    $("offBanner").classList.toggle("hide", d.enabled);
    const s = d.summary || {};
    $("stats").innerHTML = [
      [s.withAccess ?? 0, `of ${s.people ?? 0} with access`, ""],
      [s.playingNow ?? 0, "playing now", s.playingNow ? "live" : ""],
      [s.activeToday ?? 0, "active today", ""],
      [s.gamesToday ?? 0, "games today", ""],
    ].map(([b, t, c]) => `<div class="stat ${c}"><b>${b}</b><span>${t}</span></div>`).join("");
    spark($("spark"), s.daily || []);
    $("sparkTotal").textContent = `${(s.daily || []).reduce((a, b) => a + b, 0)} total · ${plural(s.gamesWeek ?? 0, "game")} this week`;
    if (S.code) { const p = (d.people || []).find((x) => x.hash === S.code.hash); if (p && p.code) S.code.code = p.code; }
    renderPeople();
  }

  // --- action wrapper ---
  async function act(action, extra, okMsg, quiet) {
    if (S.busy) return;
    S.busy = true; $("msg").classList.remove("err");
    if (!quiet) $("msg").textContent = "Saving…";
    try {
      const d = await apiCall(action, extra);
      render(d);
      $("msg").textContent = okMsg || "";
      if (okMsg) toast(okMsg);
      return d;
    } catch (e) {
      $("msg").textContent = e.message; $("msg").classList.add("err");
      if (e.status === 401) logout();
    } finally { S.busy = false; }
  }

  // --- auth / boot ---
  function showDash() { $("login").classList.add("hide"); $("dash").classList.remove("hide"); $("logout").classList.remove("hide"); }
  function logout() { PW = ""; try { sessionStorage.removeItem("tb-pw"); } catch {} $("dash").classList.add("hide"); $("login").classList.remove("hide"); $("logout").classList.add("hide"); $("pw").focus(); }

  $("login").onsubmit = async (e) => {
    e.preventDefault();
    PW = $("pw").value; $("loginMsg").textContent = ""; $("loginMsg").classList.remove("err"); $("go").disabled = true;
    try { const d = await apiCall("list"); render(d); try { sessionStorage.setItem("tb-pw", PW); } catch {} $("pw").value = ""; showDash(); }
    catch (err) { $("loginMsg").textContent = err.message; $("loginMsg").classList.add("err"); }
    finally { $("go").disabled = false; }
  };
  $("logout").onclick = logout;
  $("global").onclick = () => { const on = $("global").getAttribute("aria-checked") !== "true"; act("enabled", { on }, on ? "Tilebot is on" : "Tilebot is off for everyone"); };
  $("addForm").onsubmit = async (e) => {
    e.preventDefault();
    const name = $("who").value.trim(); if (!name) return;
    $("addBtn").disabled = true;
    const d = await act("add", { name }, `Added ${name}`, true);
    $("addBtn").disabled = false;
    if (d && d.newKey) { $("who").value = ""; showCode(d.newKey, name, d.newFor); copy(d.newKey, `${name}'s code copied`); }
  };
  $("q").oninput = (e) => { S.q = e.target.value; renderPeople(); };
  $("sort").onchange = (e) => { S.sort = e.target.value; renderPeople(); };
  $("exportBtn").onclick = () => exportCSV();

  function exportCSV() {
    if (!S.data || !S.data.people.length) { toast("Nothing to export"); return; }
    const head = ["Name", "Access", "Expires", "Today", "Week", "Month", "Days active", "Avg score", "Best score", "Last used", "App", "Added", "Note", "Code"];
    const rows = S.data.people.map((p) => [
      p.name, p.active ? (p.live ? "on" : "expired") : "off", p.expires ? toYMD(p.expires) : "",
      p.today, p.week, p.month, p.days, p.avg ?? "", p.best ?? "",
      p.last ? new Date(p.last).toISOString() : "", p.version ?? "", toYMD(p.added), p.note ?? "", p.code ?? "",
    ]);
    const csv = [head, ...rows].map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = `tilebot-usage-${toYMD(new Date().toISOString())}.csv`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast("CSV downloaded");
  }

  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.open && !S.editing) { S.open = null; renderPeople(); } });

  // auto-login if remembered
  if (PW) apiCall("list").then((d) => { render(d); showDash(); }).catch(logout);
  // poll (pause while editing, busy, or page hidden)
  setInterval(() => { if (PW && !document.hidden && !S.editing && !S.busy && !$("dash").classList.contains("hide")) apiCall("list").then(render).catch(() => {}); }, 30000);

  // test seam
  window.__TB = { setMock(fn) { apiCall = fn; }, render, showDash, state: S, boot: (d) => { render(d); showDash(); } };
})();
</script>
</body>
</html>
